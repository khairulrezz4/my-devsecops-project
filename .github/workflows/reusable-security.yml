name: Reusable security checks

on:
  workflow_call:
    inputs:
      codeql-languages:
        description: Comma-separated CodeQL languages
        required: false
        type: string
        default: ''
      codeql-build-mode:
        description: 'CodeQL build mode: none or autobuild'
        required: false
        type: string
        default: none

permissions:
  contents: read
  security-events: write

jobs:
  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Initialize CodeQL
        if: inputs.codeql-languages != ''
        uses: github/codeql-action/init@5c8ea125689a2c5ae2672d1d914ac4bcd95d1b4b # v3
        with:
          languages: ${{ inputs.codeql-languages }}
          build-mode: ${{ inputs.codeql-build-mode }}

      - name: Autobuild CodeQL targets
        if: inputs.codeql-languages != '' && inputs.codeql-build-mode == 'autobuild'
        uses: github/codeql-action/autobuild@5c8ea125689a2c5ae2672d1d914ac4bcd95d1b4b # v3

      - name: Analyze with CodeQL
        if: inputs.codeql-languages != ''
        uses: github/codeql-action/analyze@5c8ea125689a2c5ae2672d1d914ac4bcd95d1b4b # v3
        with:
          output: codeql-results

      - name: Generate CodeQL HTML and PDF report
        if: inputs.codeql-languages != ''
        shell: bash
        run: python scripts/codeql_report.py codeql-results codeql-report

      - name: Upload CodeQL report
        if: inputs.codeql-languages != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codeql-report
          path: codeql-report
          if-no-files-found: error
