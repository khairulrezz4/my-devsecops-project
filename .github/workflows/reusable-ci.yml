name: Reusable CI

on:
  workflow_call:
    inputs:
      build-command:
        description: Project build command
        required: false
        type: string
        default: ''
      test-command:
        description: Project test command
        required: false
        type: string
        default: ''
      artifact-path:
        description: Optional build output path
        required: false
        type: string
        default: ''
      artifact-name:
        description: Name of the build artifact
        required: false
        type: string
        default: build-artifact

permissions:
  contents: read

jobs:
  ci:
    name: Build Step
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate pipeline configuration
        uses: khairulrezz4/my-devsecops-project/.github/actions/validate-pipeline-config@35d552e0af556aee41597e824bc460e48de57a2f # feature/ci-cd-workflow-template

      - name: Run build command
        if: inputs.build-command != ''
        shell: bash
        run: ${{ inputs.build-command }}

      - name: Run test command
        if: inputs.test-command != ''
        shell: bash
        run: ${{ inputs.test-command }}

      - name: Verify build package
        if: inputs.artifact-path != ''
        env:
          ARTIFACT_PATH: ${{ inputs.artifact-path }}
        shell: bash
        run: |
          if [[ ! -e "$ARTIFACT_PATH" ]]; then
            echo "::error::Build package does not exist: $ARTIFACT_PATH"
            exit 1
          fi

      - name: Upload build package to GitHub artifact storage
        if: inputs.artifact-path != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
