name: Python POC DevSecOps Test

on:
  workflow_dispatch:
  push:
    paths:
      - 'POC/python/**'
      - 'test/workflows/python-poc.yml'

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: python-poc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  devsecops:
    name: Run Python POC pipeline
    uses: khairulrezz4/my-devsecops-project/.github/workflows/DEVSECOPS_WORKFLOW_MAIN.yml@186b5b018a2a26644f1a5e93911d6b57850dd2dd # artifact pipeline test
    with:
      build-command: 'python POC/python/build.py'
      test-command: 'python -m unittest discover -s POC/python -p "test_*.py"'
      artifact-path: 'POC/python/dist'
      artifact-name: python-poc
      deploy-enabled: false
      deploy-environment: ''
      deploy-command: ''
      # The build package is produced before deployment and consumed from artifact storage.
